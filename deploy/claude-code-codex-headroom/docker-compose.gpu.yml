services:
  headroom:
    build:
      target: gpu
    environment:
      HEADROOM_KOMPRESS_BACKEND: pytorch
      HEADROOM_FORCE_KOMPRESS: "1"
      HEADROOM_DISABLE_KOMPRESS: "0"
      HEADROOM_DISABLE_KOMPRESS_FALLBACK: "1"
      HEADROOM_NO_CCR: "1"
      HEADROOM_REQUIRE_CUDA: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
